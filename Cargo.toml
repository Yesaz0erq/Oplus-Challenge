[package]
name = "oplus"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
chrono = { version = "0.4", features = ["serde", "clock"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Full debug info (`debug = 2`) makes rustc/LLVM overflow its stack while
# generating debug data for the deeply-nested bevy_ui closure types on Windows
# (STATUS_STACK_BUFFER_OVERRUN at codegen). Line tables keep usable backtraces
# without tripping the crash.
[patch.crates-io]
parley = { path = "vendor/parley" }

[profile.dev]
debug = "line-tables-only"

